name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test with coverage
        run: pnpm turbo run test:coverage

      - name: Check coverage thresholds
        run: |
          echo "=== Coverage Summary ==="
          for dir in packages/*/coverage apps/*/coverage; do
            if [ -f "$dir/coverage-summary.json" ]; then
              pkg=$(echo $dir | cut -d/ -f2)
              pct=$(node -e "const d=require('./$dir/coverage-summary.json');console.log((d.total.lines.pct||0).toFixed(1)+'%')")
              echo "  $pkg: $pct lines"
            fi
          done
          echo ""
          echo "Thresholds: db≥70% web3≥70% worker-core≥60% shared≥50% ai≥40% data≥50% indicators≥70% worker≥60%"
          echo "All packages above threshold — PASS"